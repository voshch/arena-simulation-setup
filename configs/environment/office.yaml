groups:
  - name: "office_long_table_stacks"
    margin: 4
    size: [19.0, 17.0]      
    rotations: [0, 90]      
    entities:
      static:
        # ——— Stack 1 Entities ———
        - position: [0.0,   5.0,   0]
          model: office_long_table
        - position: [-1.5,  6.0,   0]
          model: office_chair
        - position: [ 0.0,  6.0,   0]
          model: office_chair
        - position: [ 1.5,  6.0,   0]
          model: office_chair
        - position: [-1.5,  4.0, 180]
          model: office_chair
        - position: [ 0.0,  4.0, 180]
          model: office_chair
        - position: [ 1.5,  4.0, 180]
          model: office_chair

        - position: [0.0,   0.0,  90]
          model: office_long_table
        - position: [-3.0,  1.0,  90]
          model: office_chair
        - position: [-3.0,  0.0,  90]
          model: office_chair
        - position: [-3.0, -1.0,  90]
          model: office_chair
        - position: [ 3.0,  1.0, 270]
          model: office_chair
        - position: [ 3.0,  0.0, 270]
          model: office_chair
        - position: [ 3.0, -1.0, 270]
          model: office_chair

        - position: [0.0,  -5.0,   0]
          model: office_long_table
        - position: [-1.5, -4.0,   0]
          model: office_chair
        - position: [ 0.0, -4.0,   0]
          model: office_chair
        - position: [ 1.5, -4.0,   0]
          model: office_chair
        - position: [-1.5, -6.0, 180]
          model: office_chair
        - position: [ 0.0, -6.0, 180]
          model: office_chair
        - position: [ 1.5, -6.0, 180]
          model: office_chair

        # ——— Stack 2 Entities ———
        # Top horizontal long table
        - position: [12.0,  5.0,   0]
          model: office_long_table
        # Chairs around the top table
        - position: [10.5,  6.0,   0]
          model: office_chair
        - position: [12.0,  6.0,   0]
          model: office_chair
        - position: [13.5,  6.0,   0]
          model: office_chair
        - position: [10.5,  4.0, 180]
          model: office_chair
        - position: [12.0,  4.0, 180]
          model: office_chair
        - position: [13.5,  4.0, 180]
          model: office_chair

        # Middle vertical long table
        - position: [12.0,  0.0,  90]
          model: office_long_table
        # Chairs on the left side of the middle table
        - position: [ 9.0,  1.0,  90]
          model: office_chair
        - position: [ 9.0,  0.0,  90]
          model: office_chair
        - position: [ 9.0, -1.0,  90]
          model: office_chair
        # Chairs on the right side of the middle table
        - position: [15.0,  1.0, 270]
          model: office_chair
        - position: [15.0,  0.0, 270]
          model: office_chair
        - position: [15.0, -1.0, 270]
          model: office_chair

        # Bottom horizontal long table
        - position: [12.0, -5.0,   0]
          model: office_long_table
        # Chairs around the bottom table
        - position: [10.5, -4.0,   0]
          model: office_chair
        - position: [12.0, -4.0,   0]
          model: office_chair
        - position: [13.5, -4.0,   0]
          model: office_chair
        - position: [10.5, -6.0, 180]
          model: office_chair
        - position: [12.0, -6.0, 180]
          model: office_chair
        - position: [13.5, -6.0, 180]
          model: office_chair

  - name: "office_quad_short_tables"
    margin: 3
    size: [14.0, 16.0]      
    rotations: [0, 90]      
    entities:
      static:
        # ——— Top‐Right 2×2 Grid ———
        # Top‐Left short table
        - position: [25.0,   3.0,   0]
          model: office_short_table
        - position: [25.0,   3.8,   0]
          model: office_chair
        - position: [25.0,   2.2, 180]
          model: office_chair

        # Top‐Right short table
        - position: [29.0,   3.0,   0]
          model: office_short_table
        - position: [29.0,   3.8,   0]
          model: office_chair
        - position: [29.0,   2.2, 180]
          model: office_chair

