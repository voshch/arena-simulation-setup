        - position: [ 9.0,  -10.8, 180]
          model: office_chair

        # Lower Left
        - position: [ 5.0,  -14.0,   0]
          model: office_short_table
        - position: [ 5.0,  -13.2,   0]
          model: office_chair
        - position: [ 5.0,  -14.8, 180]
          model: office_chair

        # Lower Right
        - position: [ 9.0,  -14.0,   0]
          model: office_short_table
        - position: [ 9.0,  -13.2,   0]
          model: office_chair
        - position: [ 9.0,  -14.8, 180]
          model: office_chair

        # ——— Bottom‐Right 2×2 Grid ———
        # Upper Left
        - position: [25.0,  -10.0,   0]
          model: office_short_table
        - position: [25.0,   -9.2,   0]
          model: office_chair
        - position: [25.0,  -10.8, 180]
          model: office_chair

        # Upper Right
        - position: [29.0,  -10.0,   0]
          model: office_short_table
        - position: [29.0,   -9.2,   0]
          model: office_chair
        - position: [29.0,  -10.8, 180]
          model: office_chair

        # Lower Left
        - position: [25.0,  -14.0,   0]
          model: office_short_table
        - position: [25.0,  -13.2,   0]
          model: office_chair
        - position: [25.0,  -14.8, 180]
          model: office_chair

        # Lower Right
        - position: [29.0,  -14.0,   0]
          model: office_short_table
        - position: [29.0,  -13.2,   0]
          model: office_chair
        - position: [29.0,  -14.8, 180]
          model: office_chair

  - name: "office_horizontal_long_tables"
    margin: 5
    size: [14.0, 16.0]      # Covers both original horizontal tables
    rotations: [0, 90]      # Added 90°
    entities:
      static:
        # ——— Mid Horizontal Table Entities ———
        - position: [16.0,   0.0,   0]
          model: office_long_table
        # Chairs along the top side (facing down)
        - position: [12.0,   1.2,   0]
          model: office_chair
        - position: [14.0,   1.2,   0]
          model: office_chair
        - position: [16.0,   1.2,   0]
          model: office_chair
        - position: [18.0,   1.2,   0]
          model: office_chair
        - position: [20.0,   1.2,   0]
          model: office_chair
        # Chairs along the bottom side (facing up)
        - position: [12.0,  -1.2, 180]
          model: office_chair
        - position: [14.0,  -1.2, 180]
          model: office_chair
        - position: [16.0,  -1.2, 180]
          model: office_chair
        - position: [18.0,  -1.2, 180]
          model: office_chair
