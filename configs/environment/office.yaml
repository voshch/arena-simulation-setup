        - position: [16.0,   -8.8,   0]
          model: office_chair
        - position: [18.0,   -8.8,   0]
          model: office_chair
        - position: [20.0,   -8.8,   0]
          model: office_chair
        # Chairs along the bottom side (facing up)
        - position: [12.0,  -11.2, 180]
          model: office_chair
        - position: [14.0,  -11.2, 180]
          model: office_chair
        - position: [16.0,  -11.2, 180]
          model: office_chair
        - position: [18.0,  -11.2, 180]
          model: office_chair
        - position: [20.0,  -11.2, 180]
          model: office_chair
